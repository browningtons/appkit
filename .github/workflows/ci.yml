name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Runs the same script as `npm run verify` and the scheduled
      # Dependency audit workflow, so the three gates cannot drift apart.
      - name: Audit (production deps only)
        run: npm run audit:deps
